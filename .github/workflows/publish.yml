name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      - name: Configure npm publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org

      - name: Install npm 11
        run: npm install -g npm@11

      - name: Verify toolchain
        run: node -v && npm -v

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      - name: Pack
        working-directory: packages/vite-plugin-critical-script
        run: pnpm pack --pack-destination "$RUNNER_TEMP"

      - name: Stage publish
        run: npm stage publish "$RUNNER_TEMP"/*.tgz
