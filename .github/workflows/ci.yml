name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r lint

      - run: pnpm -r typecheck

      - run: pnpm -r test

      - run: pnpm -r build

  # The documentation site is its own pnpm project, outside the workspace, so
  # "pnpm -r" above does not reach it. It installs the plugin from the registry, so it
  # needs neither the root install nor a prior build of the package.
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/website
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          cache-dependency-path: docs/website/pnpm-lock.yaml
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build
